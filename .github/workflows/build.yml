name: Build and Release Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build.yml

  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: docker-test
  TEXLIVE_VER: 24
  IMAGE_VER: 3

jobs:
  tag:
    name: Create Image/Release tag
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Create revision version
        id: rev
        shell: bash
        run: |
          set -euo pipefail

          BASE="${TEXLIVE_VER}.${IMAGE_VER}"
          REV=0

          while git show-ref --verify --quiet "refs/tags/${BASE}.${REV}"; do
            REV=$((REV + 1))
          done

          echo "rev=${REV}" >> "$GITHUB_OUTPUT"


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Exctract metadata (tags, labels) for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TEXLIVE_VER }}.${{ env.IMAGE_VER }}.${{ steps.rev.outputs.rev }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  manifest:
    name: Publish latest image
    needs:
      - build
      - tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # GitHubリポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: -1
      
      # ghcr.ioにログイン
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # マニフェストを生成してプッシュ
      - name: Create and push Docker manifest
        uses: Noelware/docker-manifest-action@master
        with:
          inputs: ${{ env.REGISTRY }}/hirotnk1118/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/hirotnk1118/${{ env.IMAGE_NAME }}:${{ needs.tag.outputs.tag }}
          images: ${{ env.REGISTRY }}/hirotnk1118/${{ env.IMAGE_NAME }}:${{ needs.tag.outputs.tag }}-amd64,${{ env.REGISTRY }}/hirotnk1118/${{ env.IMAGE_NAME }}:${{ needs.tag.outputs.tag }}-arm64
          push: true
          amend: true

  release:
    name: Publish release to GitHub
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # GitHubリポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: -1

      # タグをプッシュ
      - name: Create and Push Git tag
        run: |
          git tag ${{ needs.tag.outputs.tag }}
          git push origin ${{ needs.tag.outputs.tag }}

      # リリースを作成しアップロード
      - name: Create GitHub Release
        env:
          TZ: 'Asia/Tokyo' # タイムゾーン指定
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.tag.outputs.tag }} \
            --title "docker-test ${{ needs.tag.outputs.tag }} ($(date +'%Y/%m/%d'))" \
            --generate-notes \
            --draft
