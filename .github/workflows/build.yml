name: Build and Release Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build.yml

  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hirotnk1118/kanekolab-latex-texlive
  TEXLIVE_VER: 26
  IMAGE_VER: 0

jobs:
  build-and-release:
    name: Build, Push and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Create revision version
        id: rev
        shell: bash
        run: |
          set -euo pipefail

          BASE="${TEXLIVE_VER}.${IMAGE_VER}"
          REV=0

          while git show-ref --verify --quiet "refs/tags/${BASE}.${REV}"; do
            REV=$((REV + 1))
          done

          echo "rev=${REV}" >> "$GITHUB_OUTPUT"


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Exctract metadata (tags, labels) for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TEXLIVE_VER }}.${{ env.IMAGE_VER }}.${{ steps.rev.outputs.rev }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Create GitHub Release
        env:
          TZ: 'Asia/Tokyo'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.TEXLIVE_VER }}.${{ env.IMAGE_VER }}.${{ steps.rev.outputs.rev }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$IMAGE_TAG" \
            --target "$GITHUB_SHA" \
            --title "${IMAGE##*/} ${IMAGE_TAG} ($(date + '%Y/%m/%d'))" \
            --generate-notes \
            --draft \
            --notes "## Docker Image

          - Image: \`${IMAGE}:${IMAGE_TAG}\`
          - Architecture: \`linux/amd64\`

          Pull with:

          \`\`\`bash
          docker pull ${IMAGE}:${IMAGE_TAG}
          \`\`\`"
